# Toute la plateforme démarre avec :  docker compose up -d
# Pré-requis : cp .env.example .env
name: conso-electrique

x-spark-env: &spark-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  KAFKA_TOPIC: ${KAFKA_TOPIC}

services:
  # ============ E1 : sources et ingestion ============
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["29092:29092"]          # accès depuis votre PC (hors Docker)
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:                       # crée le topic puis s'arrête
    image: apache/kafka:3.8.0
    depends_on: {kafka: {condition: service_healthy}}
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic ${KAFKA_TOPIC} --partitions 3 --replication-factor 1
    restart: "no"

  producer:                         # rejoue le CSV comme un flux de relevés
    build: ./producer
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      PRODUCER_RATE: ${PRODUCER_RATE}
    volumes: ["./data:/data:ro"]
    restart: "no"

  # ============ E2 : Data Lake / Lakehouse ============
  # minio/minio a été retirée de Docker Hub : image Bitnami archivée, même MinIO
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/bitnami/minio/data]

  minio-init:                       # crée les buckets puis s'arrête
    image: bitnamilegacy/minio-client:2025.4.16
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/bronze local/silver local/gold local/checkpoints;
      echo 'Buckets prêts'"
    restart: "no"

  # ============ E3 : Spark ============
  # On lance les jobs à la main depuis ce conteneur, d'où les variables du .env
  spark-master:
    build: {context: ., dockerfile: spark/Dockerfile}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["${SPARK_UI_PORT:-8080}:8080", "7077:7077"]   # SPARK_UI_PORT dans .env si 8080 est pris
    environment: *spark-env
    volumes: ["./spark/jobs:/jobs"]

  # 4 cœurs / 4 Go : assez pour le streaming et un job batch en parallèle
  spark-worker:
    build: {context: ., dockerfile: spark/Dockerfile}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
    volumes: ["./spark/jobs:/jobs"]

  bronze-stream:                    # E2 : Kafka -> Bronze, en continu (hors DAG)
    build: {context: ., dockerfile: spark/Dockerfile}
    command: /opt/spark/bin/spark-submit --master spark://spark-master:7077 /jobs/kafka_to_bronze.py
    depends_on:
      spark-worker: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    environment: *spark-env
    volumes: ["./spark/jobs:/jobs"]
    restart: on-failure

  # ============ E4 : Postgres, Airflow, Superset ============
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  airflow:
    build: {context: ., dockerfile: airflow/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      spark-master: {condition: service_started}
    environment:
      <<: *spark-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username $$AIRFLOW_ADMIN_USER --password $$AIRFLOW_ADMIN_PASSWORD
      --firstname Admin --lastname Admin --role Admin --email admin@example.com || true;
      airflow scheduler & exec airflow webserver"
    ports: ["8081:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark/jobs:/jobs

  superset:
    build: ./superset
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin --username $$SUPERSET_ADMIN_USER --password $$SUPERSET_ADMIN_PASSWORD
      --firstname Admin --lastname Admin --email admin@example.com || true;
      superset init && superset run -h 0.0.0.0 -p 8088"
    ports: ["8088:8088"]

volumes:
  kafka_data: {}
  minio_data: {}
  pg_data: {}
